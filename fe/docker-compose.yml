version: "3.9"
services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3030:3030"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      HOST: "0.0.0.0"
      WDS_SOCKET_PORT: "3030"
      PORT: "3030"                # CRA에서 dev 서버 포트 지정
    command: sh -c "npm ci && npm start"
